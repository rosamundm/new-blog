{% load wagtailimages_tags %}

<blockquote{% if self.attribute_name %} class="has-attribute"{% endif %}>
    <h4 class="pull-quote">
        {{ self.text }}
    </h4>
    {% if self.attribute_name %}
    <p class="attribute-name">
        {{ self.attribute_name }}
    </p>
    {% endif %}
</blockquote>
